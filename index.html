<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#131314">
  <title>Atlas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; position: relative; }

    /* Topbar */
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-size: 1.1rem; border-bottom: 1px solid #1e1f20; }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .icon-btn { background: transparent; border: none; color: #e3e3e3; font-size: 1.25rem; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; }
    .icon-btn:active { background: #282a2c; }
    .brand-gradient { background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }

    /* Sidebar Drawer */
    .sidebar-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .sidebar-overlay.active { opacity: 1; pointer-events: auto; }
    .sidebar { position: absolute; top: 0; left: 0; width: 280px; height: 100%; background-color: #1e1f20; z-index: 100; transform: translateX(-100%); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; padding: 16px; border-right: 1px solid #282a2c; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .new-chat-btn { background: #282a2c; color: #fff; border: 1px solid #3c4043; border-radius: 20px; padding: 10px 14px; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer; width: 100%; margin-bottom: 16px; }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .history-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; font-size: 0.88rem; color: #c4c7c5; cursor: pointer; }
    .history-item.active { background: #282a2c; color: #fff; font-weight: 500; }
    .history-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .delete-chat-btn { background: transparent; border: none; color: #8e918f; font-size: 1rem; cursor: pointer; padding: 0 4px; }

    /* Chat Messages */
    .chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .welcome { margin-top: 25vh; text-align: center; }
    .welcome h1 { font-size: 2.2rem; font-weight: 500; line-height: 1.3; }
    
    .msg-group { display: flex; flex-direction: column; max-width: 88%; }
    .user-group { align-self: flex-end; align-items: flex-end; }
    .atlas-group { align-self: flex-start; align-items: flex-start; }

    .msg-bubble { padding: 12px 16px; border-radius: 20px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; white-space: pre-wrap; }
    .user-bubble { background-color: #282a2c; border-bottom-right-radius: 4px; color: #fff; }
    .atlas-bubble { background-color: transparent; padding-left: 2px; color: #e3e3e3; }
    
    .edit-btn { background: transparent; border: none; color: #8e918f; font-size: 0.8rem; cursor: pointer; margin-top: 4px; padding: 2px 6px; border-radius: 6px; align-self: flex-end; }
    .edit-btn:hover { color: #fff; background: #1e1f20; }

    .atlas-image { margin-top: 10px; max-width: 100%; border-radius: 14px; display: block; border: 1px solid #333538; }
    .atlas-link { color: #8ab4f8; text-decoration: underline; word-break: break-all; }

    /* Input Controls */
    .input-wrapper { padding: 12px 16px 20px; background-color: #131314; }
    .input-pill { display: flex; align-items: center; background-color: #1e1f20; border-radius: 28px; padding: 6px 8px 6px 16px; border: 1px solid #333538; gap: 8px; }
    input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 1rem; padding: 8px 0; }
    
    .btn-circle { border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; transition: all 0.2s ease; }
    .mic-btn { background: #282a2c; color: #8ab4f8; }
    .mic-btn.listening { background: #ea4335; color: #fff; animation: pulse 1s infinite alternate; }
    .send-btn { background: #e3e3e3; color: #131314; font-weight: bold; font-size: 1.1rem; }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); box-shadow: 0 0 10px rgba(234, 67, 53, 0.7); }
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar(false)"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span style="font-weight: 600; font-size: 1.1rem;">Chat History</span>
      <button class="icon-btn" onclick="toggleSidebar(false)">✕</button>
    </div>
    <button class="new-chat-btn" onclick="createNewChat()">
      <span>+</span> New Chat
    </button>
    <div class="history-list" id="history-list"></div>
  </div>

  <div class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" onclick="toggleSidebar(true)">☰</button>
      <span class="brand-gradient">Atlas</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="tts-toggle" onclick="toggleVoice()" title="Toggle voice output">🔊</button>
      <span style="font-size:0.8rem; color:#8e918f;">Gemini 3.1</span>
    </div>
  </div>

  <div class="chat-container" id="chat">
    <div class="welcome" id="welcome-banner">
      <h1 class="brand-gradient">Hello</h1>
      <p style="color:#c4c7c5; margin-top:8px;">How can Atlas help you today?</p>
    </div>
  </div>

  <div class="input-wrapper">
    <div class="input-pill">
      <input type="text" id="prompt-input" placeholder="Talk or ask Atlas anything..." autocomplete="off">
      <button class="btn-circle mic-btn" id="mic-btn" onclick="toggleListening()" title="Speak to Atlas">🎙</button>
      <button class="btn-circle send-btn" id="send-btn" onclick="handleSend()">↑</button>
    </div>
  </div>

  <script>
    let chats = JSON.parse(localStorage.getItem('atlas_chats') || '[]');
    let currentChatId = localStorage.getItem('atlas_active_id') || null;
    let voiceEnabled = localStorage.getItem('atlas_voice_enabled') !== 'false';
    let isListening = false;
    let recognition = null;
    let availableVoices = [];

    // Preload system voices
    function updateVoiceList() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }
    updateVoiceList();
    if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = updateVoiceList;
    }

    // Sung Jin-woo Deep Baritone Voice Engine
    function speakAtlasVoice(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const clean = text
        .replace(/https?:\/\/[^\s]+/g, '')
        .replace(/```[\s\S]*?```/g, '')
        .replace(/[*#_`~>]/g, '')
        .trim();

      if (!clean) return;

      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.pitch = 0.65; // Low, resonant shadow tone
      utterance.rate = 0.88;  // Deliberate and cold cadence
      utterance.volume = 1.0;

      if (availableVoices.length === 0) {
        availableVoices = window.speechSynthesis.getVoices();
      }

      // Prioritize deep natural male models
      const targetVoice = 
        availableVoices.find(v => v.lang.startsWith('en') && (v.name.includes('en-us-x-iom') || v.name.includes('en-us-x-sfg#male') || v.name.includes('en-gb-x-rjs#male'))) ||
        availableVoices.find(v => v.lang.startsWith('en') && (v.name.includes('Google US English Male') || v.name.includes('Google UK English Male'))) ||
        availableVoices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('male')) ||
        availableVoices.find(v => v.name.includes('Guy') || v.name.includes('David')) ||
        availableVoices.find(v => v.lang.startsWith('en-US')) ||
        availableVoices.find(v => v.lang.startsWith('en'));

      if (targetVoice) {
        utterance.voice = targetVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    // Voice recognition setup
    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
          isListening = true;
          document.getElementById('mic-btn').classList.add('listening');
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          document.getElementById('prompt-input').value = transcript;
          handleSend();
        };

        recognition.onerror = () => stopListening();
        recognition.onend = () => stopListening();
      } else {
        document.getElementById('mic-btn').style.display = 'none';
      }
    }

    function toggleListening() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
        stopListening();
      } else {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        try { recognition.start(); } catch (e) { stopListening(); }
      }
    }

    function stopListening() {
      isListening = false;
      document.getElementById('mic-btn').classList.remove('listening');
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      localStorage.setItem('atlas_voice_enabled', voiceEnabled);
      document.getElementById('tts-toggle').innerText = voiceEnabled ? '🔊' : '🔇';
      if (!voiceEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function saveChats() {
      localStorage.setItem('atlas_chats', JSON.stringify(chats));
      localStorage.setItem('atlas_active_id', currentChatId);
    }

    function toggleSidebar(open) {
      document.getElementById('sidebar').classList.toggle('open', open);
      document.getElementById('overlay').classList.toggle('active', open);
      if (open) renderHistoryMenu();
    }

    function createNewChat() {
      currentChatId = 'chat_' + Date.now();
      chats.unshift({ id: currentChatId, title: 'New Conversation', messages: [] });
      saveChats();
      toggleSidebar(false);
      renderActiveChat();
    }

    function renderHistoryMenu() {
      const list = document.getElementById('history-list');
      list.innerHTML = '';
      chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = 'history-item' + (chat.id === currentChatId ? ' active' : '');
        item.onclick = () => { currentChatId = chat.id; saveChats(); toggleSidebar(false); renderActiveChat(); };

        const titleSpan = document.createElement('span');
        titleSpan.innerText = chat.title || 'Conversation';
        item.appendChild(titleSpan);

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-chat-btn';
        delBtn.innerHTML = '🗑';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          chats = chats.filter(c => c.id !== chat.id);
          if (currentChatId === chat.id) currentChatId = chats[0]?.id || null;
          saveChats();
          renderHistoryMenu();
          renderActiveChat();
        };
        item.appendChild(delBtn);
        list.appendChild(item);
      });
    }

    function renderActiveChat() {
      const chatContainer = document.getElementById('chat');
      const welcome = document.getElementById('welcome-banner');
      chatContainer.querySelectorAll('.msg-group').forEach(el => el.remove());

      const active = chats.find(c => c.id === currentChatId);
      if (!active || active.messages.length === 0) {
        welcome.style.display = 'block';
        return;
      }

      welcome.style.display = 'none';
      active.messages.forEach((m, idx) => {
        if (m.role === 'user') {
          renderUserBubble(m.text, idx);
        } else {
          renderAtlasBubble(m.text);
        }
      });
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function renderUserBubble(text, msgIndex) {
      const group = document.createElement('div');
      group.className = 'msg-group user-group';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble user-bubble';
      bubble.innerText = text;
      group.appendChild(bubble);

      const editBtn = document.createElement('button');
      editBtn.className = 'edit-btn';
      editBtn.innerHTML = '✎ Edit';
      editBtn.onclick = () => editMessage(msgIndex);
      group.appendChild(editBtn);

      document.getElementById('chat').appendChild(group);
    }

    function renderAtlasBubble(rawText) {
      const group = document.createElement('div');
      group.className = 'msg-group atlas-group';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble atlas-bubble';

      const urlRegex = /(https?:\/\/[^\s]+)/g;
      const imgRegex = /https?:\/\/[^\s]+(?:pollinations\.ai[^\s]*|\.(?:png|jpg|jpeg|gif|webp)[^\s]*)/i;
      const imgMatch = rawText.match(imgRegex);

      const textDiv = document.createElement('div');
      textDiv.innerHTML = rawText.replace(urlRegex, u => `<a href="${u}" target="_blank" class="atlas-link">${u}</a>`);
      bubble.appendChild(textDiv);

      if (imgMatch) {
        const img = document.createElement('img');
        img.src = imgMatch[0];
        img.className = 'atlas-image';
        img.loading = 'lazy';
        bubble.appendChild(img);
      }

      group.appendChild(bubble);
      document.getElementById('chat').appendChild(group);
    }

    function editMessage(index) {
      const active = chats.find(c => c.id === currentChatId);
      if (!active) return;
      const input = document.getElementById('prompt-input');
      input.value = active.messages[index].text;
      input.focus();

      active.messages = active.messages.slice(0, index);
      saveChats();
      renderActiveChat();
    }

    async function handleSend() {
      const input = document.getElementById('prompt-input');
      const text = input.value.trim();
      if (!text) return;

      if (!currentChatId || !chats.some(c => c.id === currentChatId)) {
        currentChatId = 'chat_' + Date.now();
        chats.unshift({ id: currentChatId, title: text.substring(0, 24), messages: [] });
      }

      const active = chats.find(c => c.id === currentChatId);
      if (active.messages.length === 0) active.title = text.substring(0, 24);

      active.messages.push({ role: 'user', text: text });
      saveChats();
      input.value = '';
      renderActiveChat();

      const chatContainer = document.getElementById('chat');
      const thinkingGroup = document.createElement('div');
      thinkingGroup.className = 'msg-group atlas-group';
      thinkingGroup.innerHTML = '<div class="msg-bubble atlas-bubble">Thinking...</div>';
      chatContainer.appendChild(thinkingGroup);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({prompt: text})
        });
        const data = await res.json();
        const replyText = typeof data.reply === 'string' ? data.reply : JSON.stringify(data.reply);
        thinkingGroup.remove();

        active.messages.push({ role: 'assistant', text: replyText });
        saveChats();
        renderActiveChat();
        speakAtlasVoice(replyText);
      } catch (err) {
        thinkingGroup.remove();
        active.messages.push({ role: 'assistant', text: 'Connection Error: ' + err.message });
        saveChats();
        renderActiveChat();
      }
    }

    document.getElementById('prompt-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSend();
    });

    // Boot up services
    initSpeech();
    document.getElementById('tts-toggle').innerText = voiceEnabled ? '🔊' : '🔇';
    if (!currentChatId && chats.length > 0) currentChatId = chats[0].id;
    renderActiveChat();
  </script>
</body>
</html>
